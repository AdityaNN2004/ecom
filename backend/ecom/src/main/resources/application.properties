spring.application.name=ecom
server.port=9090
# Ensure Hibernate uses the correct timezone for JDBC operations
#spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# The hostname 'postgres-db' matches the service name in docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=aditya
spring.datasource.password=manager
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Change the Swagger UI path
springdoc.swagger-ui.path=/custom-swagger.html

# Change the underlying OpenAPI JSON path
springdoc.api-docs.path=/custom-api-docs

# Disable Swagger UI entirely (e.g., in a production profile)
springdoc.swagger-ui.enabled=false
